# Catálogo de edifícios. Todos os números são provisórios: vão ser
# ajustados quando a produção estiver rodando e der para medir.
#
# Campos:
#   id, nome        identificador interno e nome exibido
#   fase            vila | mercado | cidade | hansa | auge (quando é liberado)
#   tamanho         [largura, altura] em células, sem contar os campos
#   terreno         terreno exigido em todas as células do edifício
#   cor             cor provisória até existirem sprites
#   trabalhadores   quantos moradores o edifício emprega
#   estoque         capacidade de cada item de entrada e de saída
#   moradores       quantos moram ali (só casas)
#   deposito        true = guarda qualquer item até `estoque` no total
#                   (armazém); os demais guardam só o que as receitas usam,
#                   até `estoque` de cada
#   alimenta_sem_teto  guarda e distribui comida a moradores sem casa
#   carregadores    quantos carregadores moram no depósito (só depósitos)
#   campos          largura do anel de lavoura em volta (só fazendas);
#                   as células do anel precisam ser campo livre
#   requer          { terreno, distancia }: pelo menos uma célula desse
#                   terreno a até `distancia` células da borda do edifício
#   extrai          terreno consumido por ciclo e convertido em campo
#   custo           materiais retirados dos estoques ao construir
#
# [[edificio.receita]]: o que o edifício transforma. Mais de uma receita
# significa alternativas (a olaria aceita carvão ou turfa).
#   dias            duração de um ciclo, em dias de jogo
#   entradas/saidas { item = quantidade }
#   sazonalidade    fator de produção por mês, de janeiro a dezembro
#                   (omitido = 1 o ano todo; 0 = parado)
#
# [[tecnica]]: melhoria de produção pesquisada uma vez e válida para todos os
# edifícios dos tipos listados, inclusive os construídos depois.
#   id, nome        identificador interno e nome exibido
#   descricao       uma linha sobre a técnica, mostrada no painel
#   fase            a partir de quando pode ser pesquisada
#   edificios       ids dos edifícios que ela acelera (precisam ter receita)
#   requer          id de uma técnica declarada antes (o nível anterior)
#   custo           materiais retirados dos estoques ao pesquisar
#   bonus           produtividade a mais (0.75 = +75%), somada às outras
#                   técnicas já pesquisadas para o mesmo edifício

