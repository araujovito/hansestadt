[[edificio]]
id = "lenhador"
nome = "lenhador"
fase = "vila"
tamanho = [2, 2]
terreno = "campo"
cor = "#7a5834"
trabalhadores = 1
estoque = 6
custo = { tora = 4 }
requer = { terreno = "floresta", distancia = 3 }
extrai = "floresta"

[[edificio.receita]]
dias = 4
saidas = { tora = 1 }
# Cada ciclo remove uma célula de floresta próxima. Corte no inverno: a seiva
# está baixa, a madeira seca melhor, e é quando
# o trabalho do campo não ocupa os braços.
sazonalidade = [1.2, 1.2, 1.0, 0.8, 0.6, 0.6, 0.6, 0.6, 0.8, 1.0, 1.2, 1.2]

[[edificio]]
