# ---------------------------------------------------------- técnicas
# Decisão do Vitor (2026-10-03): técnicas por tipo de edifício, como nos
# Age of Empires; dois níveis de +75% cada (2,5× no fim), liberados por
# fase. Custos: madeira no primeiro nível, couro, tecido ou tijolo no
# segundo. Fases, custos e nomes são proposta inicial, a medir com
# `python3 ferramentas/balancear.py --nivel 1` (e 2).

[[tecnica]]
